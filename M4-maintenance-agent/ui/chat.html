<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RailSense — Maintenance Engineer Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2563eb;
    --primary-light: #3b82f6;
    --primary-dark: #1d4ed8;
    --bg: #f8fafc;
    --white: #ffffff;
    --border: #e2e8f0;
    --border-focus: #93c5fd;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-light: #94a3b8;
    --green: #10b981;
    --red: #ef4444;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "DM Sans", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Header ── */
  header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }
  .header-logo { width: 34px; height: 34px; flex-shrink: 0; }
  .header-text { flex: 1; }
  .header-text h1 { font-size: 0.95rem; font-weight: 700; color: var(--text); }
  .header-text p  { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
  .nav-link {
    font-size: 0.78rem;
    color: var(--text-muted);
    text-decoration: none;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-weight: 500;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .nav-link:hover { background: var(--bg); color: var(--text); border-color: #cbd5e1; }

  /* ── Chat window ── */
  .chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 28px 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }
  .chat-window::-webkit-scrollbar { width: 5px; }
  .chat-window::-webkit-scrollbar-track { background: transparent; }
  .chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── Welcome screen ── */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 16px;
    gap: 0;
    text-align: center;
    animation: fadeUp 0.35s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .welcome-logo { width: 68px; height: 68px; margin-bottom: 22px; }

  .welcome h2 {
    font-size: 1.65rem;
    font-weight: 700;
    background: linear-gradient(135deg, #1d4ed8 0%, #60a5fa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .welcome > p {
    color: var(--text-muted);
    font-size: 0.88rem;
    max-width: 400px;
    line-height: 1.65;
    margin-bottom: 32px;
  }

  /* ── Category grid ── */
  .categories {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 600px;
    margin-bottom: 14px;
  }
  .cat-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    padding: 16px 10px;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .cat-btn:hover {
    border-color: var(--border-focus);
    background: #eff6ff;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(37,99,235,0.1);
  }
  .cat-btn.active {
    border-color: var(--primary-light);
    background: #eff6ff;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .cat-icon { font-size: 1.35rem; }
  .cat-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    transition: color 0.15s;
  }
  .cat-btn.active .cat-label,
  .cat-btn:hover .cat-label { color: var(--primary); }

  /* ── Suggestion panel ── */
  .suggestion-panel {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 600px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    display: none;
    animation: fadeUp 0.2s ease both;
  }
  .suggestion-panel.visible { display: block; }
  .suggestion-panel-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .suggestion-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 16px;
    cursor: pointer;
    transition: background 0.1s;
    border-bottom: 1px solid var(--border);
    font-size: 0.855rem;
    color: var(--text);
  }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover { background: #f8fafc; }
  .suggestion-icon { color: var(--primary); font-size: 0.95rem; flex-shrink: 0; }

  /* ── Bubbles ── */
  .msg { display: flex; align-items: flex-start; gap: 10px; max-width: 840px; }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .msg.bot  { align-self: flex-start; }
  .msg { animation: fadeUp 0.2s ease both; }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; flex-shrink: 0; margin-top: 2px;
  }
  .avatar.user-av { background: var(--primary); }
  .avatar.bot-av  { background: var(--white); border: 1.5px solid var(--border); box-shadow: var(--shadow-sm); }

  .bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 0.875rem;
    line-height: 1.65;
    max-width: 660px;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--primary);
    color: white;
    border-bottom-right-radius: 5px;
  }
  .msg.bot .bubble {
    background: var(--white);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
    box-shadow: var(--shadow-sm);
    color: var(--text);
  }

  /* Markdown rendering inside bot bubble */
  .bubble p { margin-bottom: 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong, .bubble b { font-weight: 600; }
  .bubble ul, .bubble ol { padding-left: 18px; margin: 6px 0 8px; }
  .bubble li { margin-bottom: 4px; }
  .bubble h3 { font-size: 0.9rem; font-weight: 700; margin: 10px 0 6px; color: #1e40af; }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .bubble table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 0.82rem;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .bubble th {
    background: #f1f5f9;
    padding: 7px 11px;
    text-align: left;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .bubble td {
    padding: 7px 11px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .bubble tr:last-child td { border-bottom: none; }
  .bubble tr:hover td { background: #f8fafc; }
  .bubble code {
    background: #f1f5f9;
    border-radius: 4px;
    padding: 1px 5px;
    font-family: monospace;
    font-size: 0.82rem;
    color: #1e40af;
  }

  /* ── Citations ── */
  .citations { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .citations-label {
    font-size: 0.69rem; font-weight: 600;
    color: var(--text-light); text-transform: uppercase;
    letter-spacing: 0.6px; margin-bottom: 7px;
  }
  .citation-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: #eff6ff; border: 1px solid #bfdbfe;
    border-radius: 20px; padding: 4px 10px;
    font-size: 0.72rem; color: var(--primary);
    margin: 3px 4px 3px 0; cursor: pointer;
    transition: all 0.12s; font-weight: 500;
  }
  .citation-chip:hover { background: #dbeafe; border-color: var(--primary-light); }
  .citation-detail {
    background: #f8fafc; border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
    margin-top: 7px; font-size: 0.8rem; display: none;
  }
  .citation-detail .cd-title { color: var(--primary); font-weight: 600; margin-bottom: 5px; }
  .citation-detail .cd-text  { color: var(--text); line-height: 1.55; }
  .citation-detail .cd-source { color: var(--text-muted); font-size: 0.72rem; margin-top: 6px; }

  /* ── Typing indicator ── */
  .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 3px 0; }
  .typing-indicator span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--primary-light); opacity: 0.5;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-indicator span:nth-child(1) { animation-delay: 0s; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); opacity: 0.5; }
    40%          { transform: translateY(-5px); opacity: 1; }
  }

  /* ── Input area ── */
  .input-wrap {
    background: var(--white);
    border-top: 1px solid var(--border);
    padding: 14px 20px 16px;
    flex-shrink: 0;
  }
  .input-card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow-md);
    overflow: hidden;
    max-width: 820px;
    margin: 0 auto;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-card:focus-within {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.08), var(--shadow-md);
  }
  .input-field-row { padding: 14px 18px 8px; }
  #msg-input {
    width: 100%; border: none; outline: none;
    font-size: 0.92rem; font-family: inherit;
    color: var(--text); resize: none;
    line-height: 1.5; max-height: 120px;
    overflow-y: auto; background: transparent;
  }
  #msg-input::placeholder { color: var(--text-light); }
  .input-bottom-row {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 6px 12px 10px;
    gap: 8px;
  }
  .input-pills { display: flex; align-items: center; gap: 6px; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 20px; border: none;
    font-family: inherit; font-size: 0.78rem; font-weight: 500;
    cursor: pointer; transition: all 0.12s;
    background: #f1f5f9; color: var(--text-muted);
  }
  .pill-btn:hover { background: #e2e8f0; color: var(--text); }
  .pill-select-wrap {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 20px;
    background: #f1f5f9; font-size: 0.78rem;
    font-weight: 500; color: var(--text-muted);
    transition: all 0.12s; cursor: pointer;
  }
  .pill-select-wrap:hover { background: #e2e8f0; color: var(--text); }
  .pill-select-wrap select {
    border: none; background: transparent; font-family: inherit;
    font-size: 0.78rem; font-weight: 500; color: inherit;
    cursor: pointer; outline: none; padding: 0;
  }
  .input-right { display: flex; align-items: center; gap: 10px; }
  .method-badge {
    display: flex; align-items: center; gap: 5px;
    font-size: 0.71rem; color: var(--text-light); white-space: nowrap;
  }
  .method-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .send-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--primary); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s;
  }
  .send-btn:hover:not(:disabled) { background: var(--primary-dark); transform: scale(1.08); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 15px; height: 15px; }
  .clear-btn {
    font-size: 0.75rem; color: var(--text-light); background: none;
    border: none; cursor: pointer; padding: 4px 8px;
    border-radius: 8px; font-family: inherit; transition: all 0.12s;
  }
  .clear-btn:hover { color: var(--red); background: #fef2f2; }

  /* ── Animated gradient ── */
  @keyframes gradient-shift {
    from { transform: rotate(0deg) scale(1); }
    to   { transform: rotate(360deg) scale(1); }
  }
  .animate-gradient {
    animation: gradient-shift 10s linear infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
</style>
</head>
<body>

<!-- Header -->
<header>
  <svg class="header-logo" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 200 200">
    <g clip-path="url(#hdr_clip)">
      <mask id="hdr_mask" style="mask-type:alpha" width="200" height="200" x="0" y="0" maskUnits="userSpaceOnUse">
        <path fill="#fff" fill-rule="evenodd" d="M100 150c27.614 0 50-22.386 50-50s-22.386-50-50-50-50 22.386-50 50 22.386 50 50 50zm0 50c55.228 0 100-44.772 100-100S155.228 0 100 0 0 44.772 0 100s44.772 100 100 100z" clip-rule="evenodd"/>
      </mask>
      <g mask="url(#hdr_mask)">
        <path fill="#fff" d="M200 0H0v200h200V0z"/>
        <path fill="#2563eb" fill-opacity="0.25" d="M200 0H0v200h200V0z"/>
        <g filter="url(#hdr_blur)" class="animate-gradient">
          <path fill="#2563eb" d="M110 32H18v68h92V32z"/>
          <path fill="#1d4ed8" d="M188-24H15v98h173v-98z"/>
          <path fill="#3b82f6" d="M175 70H5v156h170V70z"/>
          <path fill="#60a5fa" d="M230 51H100v103h130V51z"/>
        </g>
      </g>
    </g>
    <defs>
      <filter id="hdr_blur" width="385" height="410" x="-75" y="-104" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
        <feFlood flood-opacity="0" result="BackgroundImageFix"/>
        <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
        <feGaussianBlur result="effect1" stdDeviation="40"/>
      </filter>
      <clipPath id="hdr_clip"><path fill="#fff" d="M0 0H200V200H0z"/></clipPath>
    </defs>
  </svg>
  <div class="header-text">
    <h1>Maintenance Engineer Assistant</h1>
    <p>Grounded in SLR official equipment manuals</p>
  </div>
  <a href="/" class="nav-link">← Dashboard</a>
</header>

<!-- Chat window -->
<div class="chat-window" id="chat-window">

  <!-- Welcome screen -->
  <div class="welcome" id="welcome-screen">

    <!-- Animated logo -->
    <svg class="welcome-logo" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 200 200">
      <g clip-path="url(#wlc_clip)">
        <mask id="wlc_mask" style="mask-type:alpha" width="200" height="200" x="0" y="0" maskUnits="userSpaceOnUse">
          <path fill="#fff" fill-rule="evenodd" d="M100 150c27.614 0 50-22.386 50-50s-22.386-50-50-50-50 22.386-50 50 22.386 50 50 50zm0 50c55.228 0 100-44.772 100-100S155.228 0 100 0 0 44.772 0 100s44.772 100 100 100z" clip-rule="evenodd"/>
        </mask>
        <g mask="url(#wlc_mask)">
          <path fill="#fff" d="M200 0H0v200h200V0z"/>
          <path fill="#2563eb" fill-opacity="0.28" d="M200 0H0v200h200V0z"/>
          <g filter="url(#wlc_blur)" class="animate-gradient">
            <path fill="#2563eb" d="M110 32H18v68h92V32z"/>
            <path fill="#1d4ed8" d="M188-24H15v98h173v-98z"/>
            <path fill="#3b82f6" d="M175 70H5v156h170V70z"/>
            <path fill="#60a5fa" d="M230 51H100v103h130V51z"/>
          </g>
        </g>
      </g>
      <defs>
        <filter id="wlc_blur" width="385" height="410" x="-75" y="-104" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
          <feFlood flood-opacity="0" result="BackgroundImageFix"/>
          <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
          <feGaussianBlur result="effect1" stdDeviation="40"/>
        </filter>
        <clipPath id="wlc_clip"><path fill="#fff" d="M0 0H200V200H0z"/></clipPath>
      </defs>
    </svg>

    <h2>How can I help you today?</h2>
    <p>Ask about engine maintenance, brake systems, bogie inspection, signal equipment, or track standards — all grounded in SLR official manuals.</p>

    <!-- Category buttons -->
    <div class="categories">
      <button class="cat-btn" onclick="toggleCategory('engine', this)">
        <span class="cat-icon">🔧</span>
        <span class="cat-label">Engine</span>
      </button>
      <button class="cat-btn" onclick="toggleCategory('brakes', this)">
        <span class="cat-icon">🛑</span>
        <span class="cat-label">Brakes</span>
      </button>
      <button class="cat-btn" onclick="toggleCategory('track', this)">
        <span class="cat-icon">🛤️</span>
        <span class="cat-label">Track</span>
      </button>
      <button class="cat-btn" onclick="toggleCategory('signals', this)">
        <span class="cat-icon">🚦</span>
        <span class="cat-label">Signals</span>
      </button>
    </div>

    <!-- Suggestion panel -->
    <div class="suggestion-panel" id="suggestion-panel">
      <div class="suggestion-panel-header" id="suggestion-panel-title"></div>
      <div class="suggestion-list" id="suggestion-list"></div>
    </div>

  </div>
</div>

<!-- Input area -->
<div class="input-wrap">
  <div class="input-card">
    <div class="input-field-row">
      <textarea id="msg-input" placeholder="Ask a maintenance question…" rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    </div>
    <div class="input-bottom-row">
      <div class="input-pills">
        <span class="pill-select-wrap">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <select id="asset-type-select">
            <option value="">Auto-detect</option>
            <option value="diesel_engine">Diesel Engine</option>
            <option value="electric_loco">Electric Loco</option>
            <option value="bogie">Bogie</option>
            <option value="brake_system">Brake System</option>
            <option value="signal_unit">Signal Unit</option>
            <option value="track_section">Track Section</option>
            <option value="level_crossing">Level Crossing</option>
            <option value="platform_gate">Platform Gate</option>
          </select>
        </span>
        <button class="clear-btn" onclick="clearChat()">Clear chat</button>
      </div>
      <div class="input-right">
        <div class="method-badge">
          <span class="method-dot" id="method-dot"></span>
          <span id="method-label">Ready</span>
        </div>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const API = '';
let history = [];
let isTyping = false;
let activeCategory = null;

// ── Category suggestions ──
const SUGGESTIONS = {
  engine: {
    label: 'Engine & Diesel',
    items: [
      { icon: '🔩', text: 'How many km until a major engine overhaul?' },
      { icon: '🛢️', text: 'How do I diagnose an engine oil leak?' },
      { icon: '🌡️', text: 'Engine overheating — emergency procedure?' },
      { icon: '⚙️', text: 'What is the correct fuel injection pressure?' },
      { icon: '🔄', text: 'How often should engine oil be changed?' },
    ],
  },
  brakes: {
    label: 'Brake Systems',
    items: [
      { icon: '📏', text: 'What is the minimum brake pad thickness?' },
      { icon: '💨', text: 'How do I bleed a vacuum brake system?' },
      { icon: '🔍', text: 'Brake fade symptoms and diagnosis?' },
      { icon: '⚠️', text: 'When should I withdraw a loco from service for brakes?' },
      { icon: '🔧', text: 'Steps to replace brake cylinder seals?' },
    ],
  },
  track: {
    label: 'Track & Geometry',
    items: [
      { icon: '📐', text: 'What is the maximum allowable track gauge deviation?' },
      { icon: '🔨', text: 'What are the steps for tamping ballast?' },
      { icon: '🔎', text: 'How do I inspect a rail joint for cracks?' },
      { icon: '📊', text: 'How often should track geometry be checked?' },
      { icon: '🔩', text: 'What should I check on sleeper fastenings?' },
    ],
  },
  signals: {
    label: 'Signal Equipment',
    items: [
      { icon: '⏱️', text: 'Signal response time exceeds 300ms — what to do?' },
      { icon: '🔦', text: 'How do I test a point motor?' },
      { icon: '💡', text: 'Signal lamp failure — replacement procedure?' },
      { icon: '🔌', text: 'How do I check relay contact resistance?' },
      { icon: '⚡', text: 'What causes intermittent signal aspect failure?' },
    ],
  },
};

function toggleCategory(key, btn) {
  const panel = document.getElementById('suggestion-panel');
  const list  = document.getElementById('suggestion-list');
  const title = document.getElementById('suggestion-panel-title');

  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));

  if (activeCategory === key) {
    activeCategory = null;
    panel.classList.remove('visible');
    return;
  }

  activeCategory = key;
  btn.classList.add('active');

  const { label, items } = SUGGESTIONS[key];
  title.textContent = label;
  list.innerHTML = items.map(s => `
    <div class="suggestion-item" onclick="sendSuggestion('${escAttr(s.text)}')">
      <span class="suggestion-icon">${s.icon}</span>
      <span>${escHtml(s.text)}</span>
    </div>`).join('');
  panel.classList.add('visible');
}

// ── Resize textarea ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function scrollBottom() {
  const w = document.getElementById('chat-window');
  w.scrollTop = w.scrollHeight;
}

function hideWelcome() {
  const ws = document.getElementById('welcome-screen');
  if (ws) ws.style.display = 'none';
}

function clearChat() {
  history = [];
  const w = document.getElementById('chat-window');
  // remove all messages but keep welcome
  [...w.children].forEach(c => { if (c.id !== 'welcome-screen') c.remove(); });
  const ws = document.getElementById('welcome-screen');
  if (ws) ws.style.display = 'flex';
  document.getElementById('method-label').textContent = 'Ready';
  document.getElementById('method-dot').style.background = 'var(--green)';
  activeCategory = null;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('suggestion-panel').classList.remove('visible');
}

// ── Bubble builders ──
function appendUserBubble(text) {
  const w = document.getElementById('chat-window');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `
    <div class="avatar user-av">👷</div>
    <div class="bubble">${escHtml(text)}</div>`;
  w.appendChild(div);
  scrollBottom();
}

function showTyping() {
  const w = document.getElementById('chat-window');
  const div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing-msg';
  div.innerHTML = `
    <div class="avatar bot-av">🔧</div>
    <div class="bubble">
      <div class="typing-indicator"><span></span><span></span><span></span></div>
    </div>`;
  w.appendChild(div);
  scrollBottom();
}
function removeTyping() { const el = document.getElementById('typing-msg'); if (el) el.remove(); }

function appendBotBubble(data) {
  const w = document.getElementById('chat-window');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `
    <div class="avatar bot-av">🔧</div>
    <div class="bubble">
      ${renderMarkdown(data.answer)}
      ${buildCitations(data.citations || [])}
    </div>`;
  w.appendChild(div);
  scrollBottom();

  div.querySelectorAll('.citation-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const detail = chip.nextElementSibling;
      if (detail?.classList.contains('citation-detail'))
        detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
    });
  });
}

// ── Markdown renderer (lightweight) ──
function renderMarkdown(text) {
  let html = escHtml(text);

  // Tables: |col|col| rows
  html = html.replace(/((\|.+\|\n?)+)/g, match => {
    const rows = match.trim().split('\n').filter(r => r.trim());
    let out = '<table>';
    rows.forEach((row, i) => {
      if (/^\|[-| :]+\|$/.test(row.trim())) return; // separator row
      const cells = row.split('|').filter((_, ci) => ci > 0 && ci < row.split('|').length - 1);
      const tag = i === 0 ? 'th' : 'td';
      out += '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
    });
    return out + '</table>';
  });

  // Headings
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm,  '<h3>$1</h3>');

  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/__(.+?)__/g,     '<strong>$1</strong>');

  // Horizontal rule
  html = html.replace(/^---+$/gm, '<hr>');

  // Bullet lists
  html = html.replace(/((?:^[-*•] .+\n?)+)/gm, match => {
    const items = match.trim().split('\n').map(l => `<li>${l.replace(/^[-*•] /, '').trim()}</li>`).join('');
    return `<ul>${items}</ul>`;
  });

  // Numbered lists
  html = html.replace(/((?:^\d+\. .+\n?)+)/gm, match => {
    const items = match.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '').trim()}</li>`).join('');
    return `<ol>${items}</ol>`;
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Paragraphs from double-newlines
  html = html.split(/\n\n+/).map(block => {
    block = block.trim();
    if (!block) return '';
    if (/^<(h3|ul|ol|table|hr)/.test(block)) return block;
    return `<p>${block.replace(/\n/g, '<br>')}</p>`;
  }).filter(Boolean).join('');

  return html;
}

function buildCitations(citations) {
  if (!citations.length) return '';
  const chips = citations.map((c, i) => `
    <span class="citation-chip">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
      </svg>
      ${escHtml(c.section_title || c.manual || 'Manual')}
    </span>
    <div class="citation-detail" style="display:none">
      <div class="cd-title">${escHtml(c.manual || '')} — ${escHtml(c.section_title || '')}</div>
      <div class="cd-text">${escHtml((c.snippet || '').substring(0, 400))}…</div>
      <div class="cd-source">📁 ${escHtml(c.source_file || '')}${c.score != null ? ' · relevance: ' + c.score.toFixed(3) : ''}</div>
    </div>`).join('');
  return `<div class="citations"><div class="citations-label">Sources</div>${chips}</div>`;
}

function updateMethodBadge(method, retrieval) {
  const dot   = document.getElementById('method-dot');
  const label = document.getElementById('method-label');
  const isLLM = method === 'llm_grounded';
  dot.style.background = isLLM ? 'var(--primary-light)' : 'var(--green)';
  label.textContent = `${isLLM ? 'LLM · ' : 'Template · '}${retrieval === 'supabase_pgvector' ? 'pgvector' : 'TF-IDF'}`;
}

// ── Send ──
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text || isTyping) return;

  hideWelcome();
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;
  isTyping = true;

  appendUserBubble(text);
  showTyping();

  try {
    const res = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message:    text,
        asset_type: document.getElementById('asset-type-select').value,
        history:    history.slice(-10),
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }
    const data = await res.json();
    removeTyping();
    appendBotBubble(data);
    updateMethodBadge(data.answer_method, data.retrieval_method);
    history.push({ role: 'user',      content: text });
    history.push({ role: 'assistant', content: data.answer });
  } catch (err) {
    removeTyping();
    const w   = document.getElementById('chat-window');
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = `
      <div class="avatar bot-av">🔧</div>
      <div class="bubble" style="border-color:var(--red);color:var(--red)">
        Error: ${escHtml(err.message)}
      </div>`;
    w.appendChild(div);
    scrollBottom();
  } finally {
    isTyping = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('msg-input').focus();
  }
}

function sendSuggestion(text) {
  document.getElementById('msg-input').value = text;
  sendMessage();
}

// ── Utils ──
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(str) {
  return String(str).replace(/'/g,"\\'");
}
